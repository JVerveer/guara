name: guara_semantics
version: "1.0.0"
config-version: 2

profile: guara

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

vars:
  semantic_domain_id: bouwen-en-wonen
  semantic_source_system: CBS
  semantic_dataset_code: ""
  semantic_profile_facts: true
  semantic_fact_profile_mode: sampled
  semantic_fact_profile_sample_rows_per_dataset: 10000

models:
  guara_semantics:
    semantic:
      staging:
        +materialized: view
        +schema: semantic_dbt_staging
      profiling:
        +materialized: table
        +schema: semantic
      marts:
        +materialized: table
        +schema: semantic
